name: toantuduy

# =============================================================================
# Docker Compose cho Hệ thống Toán Tư Duy
#
#   docker compose up -d --build              # chạy toàn bộ stack
#   docker compose --profile tools run --rm migrate   # áp dụng migration EF Core
#   docker compose --profile tools run --rm seed      # nạp dữ liệu demo
#
# Biến cấu hình được đọc từ file .env ở thư mục gốc (xem .env.example).
# =============================================================================

services:
  # ─── SQL Server 2022 ───────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: toantuduy-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Hãy đặt MSSQL_SA_PASSWORD trong file .env}
      MSSQL_PID: ${MSSQL_PID:-Developer}
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1'",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - toantuduy
    restart: unless-stopped

  # ─── Redis (đếm thông báo chưa đọc / SignalR backplane) ────────────────────
  redis:
    image: redis:7-alpine
    container_name: toantuduy-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - toantuduy
    restart: unless-stopped

  # ─── ASP.NET Core Web API ──────────────────────────────────────────────────
  backend:
    build:
      context: ./Backend/ToanTuDuy
      dockerfile: Dockerfile
      target: final
    image: toantuduy/backend:local
    container_name: toantuduy-backend
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${DB_NAME:-ToanTuDuyDb};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Redis__ConnectionString: "redis:6379,abortConnect=false,connectTimeout=2000,syncTimeout=2000"
      Jwt__Key: ${JWT_KEY:-Chuoi_Bi_Mat_Dai_Va_Phuc_Tap_Nhat_Co_The_123!@#}
      Jwt__Issuer: ${JWT_ISSUER:-ToanTuDuy}
      Jwt__Audience: ${JWT_AUDIENCE:-ToanTuDuyClient}
      EmailVerification__BaseUrl: ${PUBLIC_WEB_URL:-http://localhost:8080}
      EmailVerification__FromEmail: ${EMAIL_FROM:-onboarding@resend.dev}
      PasswordReset__FromEmail: ${PASSWORD_RESET_FROM_EMAIL:-onboarding@resend.dev}
      Resend__ApiToken: ${RESEND_API_TOKEN:-}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL:-}
      Smtp__FromName: ${SMTP_FROM_NAME:-Hệ thống Toán Tư Duy}
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME:-dzmtjui5d}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY:-622845256911255}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET:-jajjo9MJxZsCoitM2EqejvSphHI}
      Google__ClientId: ${GOOGLE_CLIENT_ID:-960166964291-v31v0cr8hc5gsj50jvvenhvo6r9le1rv.apps.googleusercontent.com}
      VnPay__TmnCode: ${VNPAY_TMN_CODE:-}
      VnPay__HashSecret: ${VNPAY_HASH_SECRET:-}
      VnPay__BaseUrl: ${VNPAY_BASE_URL:-}
      VnPay__ReturnUrl: ${VNPAY_RETURN_URL:-}
      VnPay__IpnUrl: ${VNPAY_IPN_URL:-}
      VnPay__MobileDeepLink: ${VNPAY_MOBILE_DEEP_LINK:-}
    ports:
      - "${BACKEND_PORT:-5114}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - toantuduy
    restart: unless-stopped

  # ─── AI RAG service (FastAPI) ──────────────────────────────────────────────
  ai-backend:
    build:
      context: ./AI_Backend
      dockerfile: Dockerfile
      target: final
    image: toantuduy/ai-backend:local
    container_name: toantuduy-ai-backend
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8001
      JWT_SECRET_KEY: ${JWT_KEY:-Chuoi_Bi_Mat_Dai_Va_Phuc_Tap_Nhat_Co_The_123!@#}
      JWT_ALGORITHM: HS256
      JWT_ISSUER: ${JWT_ISSUER:-ToanTuDuy}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ToanTuDuyClient}
      LLM_PROVIDER: ${AI_LLM_PROVIDER:-groq}
      LLM_BASE_URL: ${AI_LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_API_KEY: ${AI_LLM_API_KEY:-}
      LLM_CHAT_MODEL: ${AI_LLM_CHAT_MODEL:-openai/gpt-oss-120b}
      LLM_SUMMARY_MODEL: ${AI_LLM_SUMMARY_MODEL:-openai/gpt-oss-20b}
      LLM_FALLBACK_ENABLED: ${AI_LLM_FALLBACK_ENABLED:-false}
      EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-nomic}
      NOMIC_API_KEY: ${AI_NOMIC_API_KEY:-}
      NOMIC_BASE_URL: ${AI_NOMIC_BASE_URL:-https://api-atlas.nomic.ai/v1}
      NOMIC_EMBEDDING_MODEL: ${AI_NOMIC_EMBEDDING_MODEL:-nomic-embed-text-v1.5}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      CHROMA_PERSIST_DIRECTORY: /app/storage/chroma
      SQLITE_URL: sqlite:////app/storage/app.db
      DOCUMENTS_DIR: /app/storage/documents
      CORS_ORIGINS: ${AI_CORS_ORIGINS:-*}
      ANONYMIZED_TELEMETRY: "False"
    ports:
      - "${AI_PORT:-8001}:8001"
    volumes:
      - ai_storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - toantuduy
    restart: unless-stopped

  # ─── Web Frontend (Vue + Nginx) ────────────────────────────────────────────
  web:
    build:
      context: ./Web_Frontend
      dockerfile: Dockerfile
      target: final
      args:
        # URL backend mà trình duyệt gọi tới. VITE_* được nhúng lúc build.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5114}
        VITE_IMPORT_WORKER_URL: ${VITE_IMPORT_WORKER_URL:-http://localhost:8000}
    image: toantuduy/web:local
    container_name: toantuduy-web
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - toantuduy
    restart: unless-stopped

  # ─── Question Import Worker (FastAPI) ──────────────────────────────────────
  import-worker:
    build:
      context: ./Backend/import-worker
      dockerfile: Dockerfile
      target: final
    image: toantuduy/import-worker:local
    container_name: toantuduy-import-worker
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      BASE_URL: ${IMPORT_WORKER_BASE_URL:-http://localhost:8000}
      LLM_PROVIDER: ${IMPORT_WORKER_LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      STORAGE_DIR: /app/storage
      UPLOAD_DIR: /app/storage/uploads
      IMAGE_DIR: /app/storage/images
      DEFAULT_BANK_ID: 1
    ports:
      - "${IMPORT_WORKER_PORT:-8000}:8000"
    volumes:
      - import_worker_storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - toantuduy
    restart: unless-stopped

  # ─── EF Core migration (chạy một lần) ─────────────────────────────────────
  migrate:
    profiles: ["tools"]
    build:
      context: ./Backend/ToanTuDuy
      dockerfile: Dockerfile
      target: migrations
    image: toantuduy/backend-migrations:local
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${DB_NAME:-ToanTuDuyDb};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__Key: ${JWT_KEY:-Chuoi_Bi_Mat_Dai_Va_Phuc_Tap_Nhat_Co_The_123!@#}
      Jwt__Issuer: ${JWT_ISSUER:-ToanTuDuy}
      Jwt__Audience: ${JWT_AUDIENCE:-ToanTuDuyClient}
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - toantuduy

  # ─── Nạp dữ liệu demo (chạy một lần, XÓA dữ liệu hiện có) ─────────────────
  # Mặc định nạp SeedData.sql; đặt SEED_FILE=DataSeed_Bogus_1000.sql để nạp 1000 dòng/bảng.
  seed:
    profiles: ["tools"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Hãy đặt MSSQL_SA_PASSWORD trong file .env}
      DB_NAME: ${DB_NAME:-ToanTuDuyDb}
      SEED_FILE: ${SEED_FILE:-SeedData.sql}
    volumes:
      - ./Backend/SeedData.sql:/scripts/SeedData.sql:ro
      - ./Backend/DataSeed_Bogus_1000.sql:/scripts/DataSeed_Bogus_1000.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        TARGET_SCRIPT="/scripts/$${SEED_FILE:-SeedData.sql}"
        if [ ! -f "$$TARGET_SCRIPT" ]; then
          echo "Không tìm thấy file seed: $$TARGET_SCRIPT" >&2
          exit 1
        fi
        echo ">>> Đang nạp dữ liệu từ $$TARGET_SCRIPT vào database $$DB_NAME..."
        if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then
          # sqlcmd (Go) mặc định đọc UTF-8 và cần -C để tin certificate tự ký
          exec /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -d "$$DB_NAME" -i "$$TARGET_SCRIPT"
        else
          # sqlcmd (ODBC) cần -f 65001 để đọc đúng tiếng Việt
          exec /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -b -d "$$DB_NAME" -i "$$TARGET_SCRIPT" -f 65001
        fi
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - toantuduy

networks:
  toantuduy:
    driver: bridge

volumes:
  sqlserver_data:
  redis_data:
  ai_storage:
  import_worker_storage:
